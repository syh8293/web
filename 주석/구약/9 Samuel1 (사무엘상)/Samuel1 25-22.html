        <h4>사무엘상 25:22 주석</h4>
        
        <p>
            25:22 만일 내가 그에게 속한 모든 자 중에서 담벼락에 오줌누는 어떤 
            자라도<sup>1</sup> 아침이 밝기까지 남겨 둔다면, 하나님께서 다윗의 
            원수들에게 벌을 내리시고 더 내리시기를 원하노라.” 하더라.  
        </p>

        <p>
            1 (25:22) 이런 투박한 표현이 <a
