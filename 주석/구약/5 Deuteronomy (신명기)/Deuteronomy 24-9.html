        <h4>신명기 24:9 주석</h4>

        <p>
            24:9 너희는 이집트에서 나온 후에 주 너의 하나님께서 길에서 
            미리암에게 행하신 일을 기억하라.<sup>3</sup>
        </p>

        <p>
            3 (24:9) 이것이 당신에게 『롯의 아내를 기억하라』 (<a
                href="https://syh8293.github.io/web/부록%20본문/신약/3%20Luk%20(누가)/Luke%2017-32.html"
                target="_blank">눅 17:32</a>)는 그리스도의 경고를 상기시키지 
            않는가? 당신은 그 두 사람의 공통점이 무엇이었는지 알고있는가? 
            그들은 모두 하얗게 변했던 것이다 (<a
                href="https://syh8293.github.io/web/부록 본문/구약/1 Gen (창세기)/Genesis 19-26-1.html"
                target="_blank">창 19:26</a>, &ensp;<a
                href="https://syh8293.github.io/web/부록 본문/구약/3 Lev (레위기)/Leviticus 13-17-1.html"
                target="_blank">레 13:17</a>, &ensp;<a
                href="https://syh8293.github.io/web/부록 본문/구약/4 Num (민수기)/Numbers 12-10-1-1.html"
                target="_blank">민 12:10</a>).
        </p>
