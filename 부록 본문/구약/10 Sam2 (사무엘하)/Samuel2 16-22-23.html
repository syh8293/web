				이스라엘의 목전에서 그의 부친의 첩들에게 들어가더라.<br><br>

				16:23 그 당시에 아히도펠이 내놓은 계략은2 마치 사람이 하나님의 말씀에 물었던
				것과 같았으니, 다윗이나 압살롬과 함께한 아히도펠의 모든 계략이 그러하더라.
