<body>
        <b>삼하 3:2-5</b><br><br>
				
				3:2 헤브론에서 다윗에게 아들들이 태어났으니, 그의 첫태생은 암논으로 
				이스르엘 여인 아히노암의 <i><small>소생이요</small></i>,<br><br>

				3:3 둘째는 킬르압으로 칼멜인 나발의 아내였던 아비가일의 <i><small>소생이요
        </small></i>, 셋째는 그술 왕 탈매의 딸 마아카의 아들 압살롬이요,<br><br>

				3:4 넷째는 학깃의 아들 아도니야며, 다섯째는 아비탈의 아들 스파티야요,<br><br>

				3:5 여섯째는 이드르암으로 다윗의 아내 에글라의 <i><small>소생</small></i> 이니, 
        이들이 헤브론에서 다윗에게 태어나니라.
