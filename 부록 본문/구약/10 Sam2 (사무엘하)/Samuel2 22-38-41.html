<body>
        <b>삼하 22:38-41</b><br><br>
				
				22:38 내가 내 원수들을 추격하여 그들을 멸하였으며, 내가 그들을 진멸하기까지
				돌아오지 아니하였나이다.<br><br>

				22:39 내가 그들을 진멸하고 상처를 입혀 그들이 일어나지 못하였으니, 정녕,
				그들이 내 발 아래 쓰러졌나이다.<br><br>

				22:40 이는 주께서 힘으로 나를 두르시어 싸우게 하셨으며, 나를 대적하여 일어난
				자들을 주께서 내 아래 굴복시키셨음이니이다.<br><br>

				22:41 주께서 또 내 원수들의 목을 내게 주시어, 나로 하여금 나를 미워하는
				자들을 멸망시키게 하셨나이다.
