        <b>삼하 18:14-15</b><br><br>
				
				18:14 요압이 말하기를 “내가 너와 함께 이렇게 지체할 수 없다.” 하고 손에
				작은 창 세 개를 가지고 아직 상수리나무 중간에 살아 있는 압살롬의 심장을
				찌르더라.<br><br>

				18:15 그러자 요압의 병기 든 청년 열 명이 압살롬을 에워싸고 쳐서 죽이니라.
