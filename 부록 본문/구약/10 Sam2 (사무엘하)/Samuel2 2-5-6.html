        <b>삼하 2:5-6</b><br><br>
				
				2:5 다윗이 사자들을 야베스길르앗 사람들에게 보내며 그들에게 말하기를 “너희는
				주께 복을 받을지어다. 이는 너희가 너희 <small>주</small>, 곧 사울에게 이
				친절을 베풀어 그를 장사하였음이라.<br><br>

				2:6 너희가 이 일을 행하였으므로 이제 주께서 너희에게 친절과 진실을 베푸시기를
				원하며 나도 너희에게 이 친절을 보답하리라.
