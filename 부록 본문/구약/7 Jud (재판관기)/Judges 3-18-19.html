				<b>판 3:18-19절</b> 그가 선물을 바치는 것을 마치자 선물을 메고 온
				사람들은 보냈으나 자기는 길갈 옆에 있는 채석장에서 돌아와 말하기를 “오
				왕이여, 내가 왕께 은밀한 용건을 가지고 있나이다.” 하니, 왕이 “조용히
				하라.”고 말하자 자기 곁에 섰던 모든 사람이 그로부터 물러났더라.
