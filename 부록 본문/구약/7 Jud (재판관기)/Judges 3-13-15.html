        <b>판 3:13-15</b><br><br>
				
				3:13 그가 암몬과 아말렉 자손들을 자기에게로 모은 후 가서 이스라엘을 쳐서
				종려나무 성읍을 차지하였더라.<br><br>

				3:14 그리하여 이스라엘 자손이 모압 왕 에글론을 십팔 년간 섬겼더라.<br><br>

				3:15 그러나 이스라엘 자손이 주께 부르짖으므로 주께서 그들에게 한 구원자를
				일으키셨으니, 베냐민인 게라의 아들 왼손잡이ㄹ 에훗이라. 이스라엘 자손이 그를
				통하여 모압 왕 에글론에게 선물을 보냈더라.
