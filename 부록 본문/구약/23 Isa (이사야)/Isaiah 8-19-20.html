        <b>사 8:19-20</b><br><br>
				
				8:19 그때에 그들이 너희에게 말하기를 “부리는 영들을 지닌 자들과, 엿보고
				중얼거리는 마법사들에게 구하라.” 하리라. 백성이 자기들의 하나님께 구해야 되지
				않겠느냐? 산 자들을 위하여 죽은 자들에게 구하겠느냐?<br><br>

				8:20 율법과 증거에게라. 만일 그들이 이 말씀에 따라 말하지 아니하면 이는 그들
				안에 빛이 없기 때문이라.
