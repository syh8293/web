        <b>대상 6:16-21</b><br><br>
				
				6:16 레위의 아들들은 게르솜과 코핫과 므라리요,<br><br>

				6:17 게르솜의 아들들의 이름은 이러하니 립니와 시므이더라.<br><br>

				6:18 코핫의 아들들은 암람과 이스할과 헤브론과 웃시엘이요,<br><br>

				6:19 므라리의 아들들은 말리와 무시라. 레위인들의 족속은 그들의 조상을 따라
				이러하니라.<br><br>

				6:20 게르솜에게서 난 자는 그의 아들 립니와 그의 아들 야핫과 그의 아들
				심마와,<br><br>

				6:21 그의 아들 요아와 그의 아들 잇도와 그의 아들 세라와 그의 아들
				여아트래라.
