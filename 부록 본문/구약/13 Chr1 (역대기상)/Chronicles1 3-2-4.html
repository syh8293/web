        <b>대상 3:2-4</b><br><br>
				
				3:2 셋째는 압살롬으로 그술 왕 탈매의 딸 마아카의 아들이요, 넷째는 아도니야로
				학깃의 아들이요,<br><br>

				3:3 다섯째는 아비탈의 소생 스파티야며, 여섯째는 그의 아내 에글라로 말미암은
				이드르암이더라.<br><br>

				3:4 이 여섯이 헤브론에서 다윗에게 태어났더라. 그가 거기서 칠 년 육 개월을
				치리하고, 예루살렘에서 삼십삼 년을 치리하였더라.
