					<b>대상 22:5</b> 다윗이 말하기를 “내 아들 솔로몬은 어리고 연약하도다.
					주를 위하여 건축되는 전은 심히 웅장하여 만국에 명성과 영광이 있어야 하리라.
					그러므로 내가 이제 그것을 위하여 준비하리라.” 하고 그가 죽기 전에 풍부하게
					준비하였더라.
