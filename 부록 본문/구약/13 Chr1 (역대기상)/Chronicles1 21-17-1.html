        <b>대상 21:17</b> 다윗이 하나님께 말씀드리기를 “백성을 계수하라고 
				명한 것은 내가 아니니이까? 실로 죄를 짓고 악을 행한 자는 바로 나니이다. 
				그러나 이 양들로 말하면 그들이 무엇을 행하였나이까? 오 주 나의
        하나님이여, 내가 주께 청하오니, 주의 손으로 나와 내 아버지의 집을
        치시고, 주의 백성은 치지 마시어 그들이 재앙을 당하지 않게 하소서.”
        하더라.
