<body>
        <b>신 12:20-21</b> 주 너의 하나님께서 네게 약속하신 대로 그분께서 네 경계를 넓혀 
				주실 때 네 마음이 고기를 먹고 싶어하면 너는 “내가 고기를 먹으리라.”고 말하고, 
				네 마음이 원하는 대로 먹어도 되느니라. 만일 주 너의 하나님께서 그분의 이름을 
				두시려고 선정하신 곳이 네게서 너무 멀면, 내가 네게 명한 대로 주께서 네게 주신 
				네 소떼와 네 양떼 중에서 잡아서 네 마음에 내키는 대로 네 성문에서 먹을지니라.
