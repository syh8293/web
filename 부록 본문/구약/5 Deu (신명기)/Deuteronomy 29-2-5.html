        <b>신 29:2-5</b><br><br>
        
        29:2 모세가 온 이스라엘을 불러서 그들에게 말하더라. 너희는 주께서
        이집트 땅에서 너희 목전에 파라오와 그의 모든 신하들과 그의 온 땅에 행하신
        일을 보았나니<br><br>

        29:3 즉 네 눈으로 보았던 큰 시험들과 표적들과 그 큰 기적들이라.<br><br>

        29:4 그러나 주께서는 깨닫는 마음과 보는 눈과 듣는 귀를 오늘까지
        너희에게 주시지 않으셨느니라.<br><br>

        29:5 내가 광야에서 사십 년 동안 너희를 인도하였으나 너희의 옷이
        너희에게서 낡아지지 않았고 네 신도 네 발에서 낡아지지 아니하였으며
