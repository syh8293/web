        <b>신 30:12-14</b><br><br>
				
				30:12 그것은 하늘에 있는 것도 아니니, 네가 말하기를 “누가 우리를 위하여
				하늘에 올라가서 그것을 우리에게로 가져와 우리로 그것을 듣고 그것을 행하게
				하랴?” 할 것이 아니며,<br><br>

				30:13 그것은 또한 바다 건너에 있는 것도 아니니 네가 말하기를 “누가 우리를
				위하여 바다를 건너가서 그것을 우리에게로 가져다가 우리로 그것을 듣고 행하게
				하랴?” 할 것이 아니니라.<br><br>

				30:14 오히려 그 말씀은 네게 아주 가까워 네 입에 있고 네 마음에 있으니,
				너는 그것을 행할 수 있느니라.
