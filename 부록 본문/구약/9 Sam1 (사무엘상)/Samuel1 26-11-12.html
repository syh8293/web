        <b>삼상 26:11-12</b><br><br>
				
				26:11 내가 내 손을 뻗쳐 주의 기름부음 받은 이를 치는 것은 주께서 금하신
				것이라. 그러나, 내가 청하노니, 너는 이제 그의 베개 곁에 있는 창과, 물병만
				취하라. 그리고 가자.” 하더라.<br><br>

				26:12 다윗이 사울의 베개에서 창과 물병을 취하고, 그들이 그것들을 가지고
				나왔으나 그것을 보는 자도 없고, 아는 자도 없으며, 깨는 자도 없더라. 그들이
				모두 잠들었으니, 이는 깊은 잠이 주께로부터 그들에게 내렸기 때문이더라.
