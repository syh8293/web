				주께서 그 성읍의 사람들을 작은 자나 큰 자나 다 치셨으니, 그들의 은밀한 부분에
				악성 종기가 생기더라.<br><br>

				5:10 그러므로 그들이 하나님의 궤를 에크론으로 보냈더니 하나님의 궤가
				에크론에 오자 에크론인들이 부르짖어 말하기를 “그들이 이스라엘의 하나님의 궤를
