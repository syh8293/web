        <b>삼상 16:2-3</b><br><br>
				
				16:2 사무엘이 말하기를 “내가 어찌 가리이까? 사울이 그 말을 들으면 나를
				죽이리이다.” 하니 주께서 말씀하시기를 “너는 너와 함께 암송아지 한 마리를 끌고
				가서 말하기를 ‘내가 주께 제사를 드리려고 왔다.’ 하고<br><br>

				16:3 이새를 희생제에 청하라. 그리하면 내가 너에게 할 일을 알려 주리니, 너는
				나를 위하여 내가 네게 거명하는 자에게 기름을 부을지니라.” 하시더라.
