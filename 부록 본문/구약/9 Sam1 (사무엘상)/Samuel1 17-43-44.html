        <b>삼상 17:43-44</b><br><br>
				
				17:43 그 필리스티아인이 다윗에게 말하기를 “내가 개이기에 네가 막대기를 가지고
				내게 나왔느냐?” 하더라. 그 필리스티아인이 자기 신들을 통해 다윗을 저주하더라.<br><br>

				17:44 또 그 필리스티아인이 다윗에게 말하기를 “내게로 오라. 내가 네 살을
				공중의 새들과 들의 짐승들에게 주리라.” 하더라.
