        <b>삼상 16:10-11</b><br><br>
				
				16:10 다시, 이새가 그의 아들 일곱을2 사무엘 앞으로 지나가게 하니, 사무엘이
				이새에게 말하기를 “주께서 이들을 택하지 아니하셨도다.” 하더라.<br><br>

				16:11 사무엘이 이새에게 말하기를 “네 자식들이 모두 여기 있느냐?” 하니 그가
				말하기를 “아직 막내가 남아 있으니, 보소서, 그가 양을 지키나이다.” 하더라.
				사무엘이 이새에게 말하기를 “보내어 그를 데려오라. 그가 여기 올 때까지 우리가
				앉지 아니할 것이라.” 하더라.
