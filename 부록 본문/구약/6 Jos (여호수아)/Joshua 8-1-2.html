        <b>수 8:1-2</b><br><br>
				
				8:1 주께서 여호수아에게 말씀하시기를 “너는 두려워 말고 낙심치 말라. 너는 너와
				함께 모든 군인들을 데리고 일어나 아이로 올라가라. 보라, 내가 아이 왕과 그의
				백성과 그의 성읍과 그의 땅을 네 손에 주었노라.<br><br>

				8:2 너는 여리코와 그곳의 왕에게 했던 것처럼 아이와 그곳의 왕에게도 행할지니라.
				그곳의 탈취물과 가축만 전리품으로 너희 것을 삼을지니라. 너는 성읍 뒤에 복병을
				둘지니라.” 하시더라.
