        <b>대하 24:25-26</b><br><br>
				
				24:25 그들이 요아스에게서 떠나간 후 (그들이 그에게 큰 병을 남겨 주었더라.)
				그의 신하들이 제사장 여호야다의 아들들의 피로 인하여 그에 대하여 모반하여 그의
				침상에서 그를 치니 그가 죽으니라. 그들이 그를 다윗 성읍에 장사하였으나 왕들의
				묘에는 장사하지 아니하였더라.<br><br>

				24:26 그에 대하여 모반한 사람들은 이러하니 암몬 여인 시므앗의 아들 사밧과
				모압 여인 시므릿의 아들 여호자밧이더라.
