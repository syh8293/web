<body>
        <b>대하 35:21</b> 그러나 느코가 대사들을 요시야에게 보내어
        말하기를 “유다 왕이여, 내가 당신과 무슨 상관이 있나이까? 나는 오늘
        당신을 치러 온 것이 아니라 내가 더불어 싸우는 그 족속을 치려는 것이니
        이는 하나님께서 내게 명하사 속히 행하게 하셨음이니이다. 나와 함께하신
        하나님께 간섭하지 마소서. 그래야 하나님께서 당신을 멸하지 아니하시리이다.”
        하더라.
