        <b>대하 6:24-25</b><br><br>
				
				6:24 만일 주의 백성 이스라엘이 주께 죄를 지음으로 적 앞에 패할 때
				돌이켜서 주의 이름을 시인하고 이 전에서 주 앞에 기도하고 간구하거든,<br><br>

				6:25 주께서는 하늘들에서 들으시고 주의 백성 이스라엘의 죄를 용서하시어 
				주께서 그들과 그들의 조상에게 주신 땅으로 그들을 다시 데려오소서.
