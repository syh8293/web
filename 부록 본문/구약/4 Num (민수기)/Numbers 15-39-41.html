        <b>민 15:39-41</b><br><br>
				
				15:39 이 술에 단 끈은 너희로 그것을 보고 주의 모든 계명들을 기억하여
				그것들을 행하게 하려는 것이니, 이는 너희로 음란하게 숭배하게 하는 자신의 마음과
				자신의 눈을 따라 추구하지 않게 하려는 것이며<br><br>

				15:40 너희로 기억하고 나의 모든 계명들을 행하여, 너희 하나님께 거룩해지게
				하려 함이니라.<br><br>

				15:41 나는 너희의 하나님이 되려고 너희를 이집트 땅에서 데리고 나온 주 너희
				하나님이니라. 나는 주 너희 하나님이라.” 하시니라.
