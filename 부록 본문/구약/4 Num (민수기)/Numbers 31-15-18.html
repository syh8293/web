        <b>민 31:15-18</b><br><br>
        
        31:15 모세가 그들에게 말하기를 “너희가 여자들을 모두 살려 두었느냐?<br><br>

        31:16 보라, 이들이 발라암의 계략을 통하여, 이스라엘 자손으로 프올의
        사건 때에 주를 거역하여 범죄하게 하여, 주의 회중에 역병이 있었느니라.<br><br>

        31:17 그러므로 이제 아이들 중에서 모든 남자는 다 죽이고1 남자와
        동침하여 남자를 안 모든 여자를 죽이라.<br><br>

        31:18 그러나 남자와 동침하지 아니하여 남자를 알지 못하는 모든 여자
        아이들은 다 너희를 위하여 살려 둘지니라.
