        <b>왕하 7:6-7</b><br><br>
				
				7:6 이는 주께서 시리아 군대로 병거들의 소리와 말들의 소리, 즉 큰 군대의
				소리를 듣게 하셨음이니 그들이 서로 말하기를 “보라, 이스라엘 왕이 우리를 치려고
				힛인들의 왕들과 이집트인들의 왕들을 용병하여 우리에게 오게 한 것이라.” 하더라.<br><br>

				7:7 이에 그들이 땅거미질 때에 일어나서 도망하였으니 그들이 장막들과 말들과
				나귀들을 버리고 즉 진영을 있는 그대로 두고 그들의 목숨을 위하여 도망하였더라.
