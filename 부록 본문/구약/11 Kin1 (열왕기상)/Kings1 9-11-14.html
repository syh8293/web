<body>
        <b>왕상 9:11-14</b><br><br>
				
				9:11 (투로 왕 히람이 솔로몬에게 그의 모든 소원대로 백향목과 전나무와 금을
				제공하였으므로) 솔로몬왕이 히람에게 갈릴리 땅에 있는 이십 성읍을 주니라.<br><br>

				9:12 히람이 투로에서 나와 솔로몬이 자기에게 준 성읍들을 보았으나 그것들이
				마음에 들지 않은지라.<br><br>

				9:13 그가 말하기를 “나의 형제여, 당신이 내게 주신 이 성읍들이 어떤
				성읍이니이까?” 하고 그가 그 성읍들을 카불의 땅이라 부르니 오늘에 이르니라.<br><br>

				9:14 히람이 왕에게 금 일백이십 달란트를 보내었더라.
