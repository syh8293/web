        <b>눅 19:17-19</b> 그에게 말하기를 ‘잘하였다, 착한 종아. 네가 아주 작은 
				일에 신실하였으니 열 성읍을 다스리는 권세를 가지라.’고 하더라. 그 다음에 
				두 번째 사람이 와서 말하기를 ‘주여, 주께서 주신 한 므나로 다섯 므나를 
				벌었나이다.’라고 하니 그에게도 이같이 말하기를 ‘너도 다섯 성읍을 다스리는 
				자가 되라.’고 하더라.
