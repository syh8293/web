        <b>행 7:48-50</b><br><br>
				
				7:48 그러나 지극히 높으신 분은 <i><small>사람의</small></i> 손으로 
				만든 성전들에는 거하지 아니하시나니 선지자가 말한 바<br><br>

				7:49 ‘주가 말하노라. 하늘은 나의 보좌요, 땅은 나의 발판이라. 너희가 나를
				위하여 어떤 집을 짓겠으며, 또 나의 안식할 곳이 무엇이겠느냐?<br><br>

				7:50 이 모든 것들을 나의 손으로 만들지 아니하였느냐?’고 함과 같으니라.
