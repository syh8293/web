        <b>롬 10:6-8</b><br><br>

				10:6 그러나 믿음에서 난 의는 이같이 말하기를 “네 마음에 ‘누가 하늘에 올라갈
				것인가?’하지 말라.”ㅂ하였으니 (그것은 그리스도를 위로부터 모셔 내리려는
				것이요,)<br><br>

				10:7 또한 “‘누가 깊은 곳으로 내려갈 것인가?’하지 말라.”ㅅ하였으니 (그것은
				그리스도를 죽은 자들로부터 다시 모셔 올리려는 것이라.)<br><br>

				10:8 그러나 그것이 무엇을 말하느냐? “말씀이 네게 가까워 네 입에 있으며 네
				마음에 있노라.” 하였으니 곧 우리가 전파하는 믿음의 말씀이라.
